[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["https://echoself.ai"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

[auth.external.apple]
enabled = true
client_id = "env(APPLE_CLIENT_ID)"
secret = "env(APPLE_CLIENT_SECRET)"

# Per-function JWT verification.
# Newer Supabase CLI requires [functions.<name>] tables — a global
# [functions] verify_jwt bool is rejected ("expected a map or struct").
# Functions default to verify_jwt = true; only externally-invoked
# endpoints (Stripe webhooks, pg_cron jobs that authenticate via
# x-cron-secret instead of a user JWT) opt out.

[functions.stripe-webhook]
verify_jwt = false

[functions.generate-daily-insight]
verify_jwt = false

[functions.pattern-detect]
verify_jwt = false

[functions.update-future-self]
verify_jwt = false

[functions.ai-push-notifications]
verify_jwt = false
