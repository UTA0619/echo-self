name: eidolon
description: "Eidolon — The Soul-Bound RPG"
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.6.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State Management ────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Navigation ──────────────────────────────────────────────────
  go_router: ^14.6.3

  # ── Animations ──────────────────────────────────────────────────
  flutter_animate: ^4.5.2
  rive: ^0.13.17

  # ── Serialization ───────────────────────────────────────────────
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # ── Networking ──────────────────────────────────────────────────
  dio: ^5.7.0

  # ── Local Storage ───────────────────────────────────────────────
  shared_preferences: ^2.3.3

  # ── Firebase ────────────────────────────────────────────────────
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.4
  firebase_storage: ^12.3.7
  firebase_remote_config: ^5.1.6
  firebase_crashlytics: ^4.1.6
  firebase_analytics: ^11.3.6

  # ── Supabase ────────────────────────────────────────────────────
  supabase_flutter: ^2.8.4

  # ── Health / Reality Sync ───────────────────────────────────────
  health: ^12.2.0

  # ── Monetization ────────────────────────────────────────────────
  purchases_flutter: ^10.1.1

  # ── Analytics / Monitoring ──────────────────────────────────────
  sentry_flutter: ^8.11.0
  mixpanel_flutter: ^2.3.4
  app_tracking_transparency: ^3.0.6

  # ── Fonts ───────────────────────────────────────────────────────
  google_fonts: ^6.2.1

  # ── Internal packages ───────────────────────────────────────────
  shared_types:
    path: ../../packages/shared_types

  # ── Utilities ───────────────────────────────────────────────────
  uuid: ^4.5.1
  intl: ^0.19.0
  logger: ^2.5.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.3
  flutter_secure_storage: ^9.2.4
  google_sign_in: ^7.1.1
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ── Code Generation ─────────────────────────────────────────────
  build_runner: ^2.4.13
  freezed: ^3.0.6
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.2

  # ── Linting ─────────────────────────────────────────────────────
  flutter_lints: ^5.0.0
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.2

  # ── Testing ─────────────────────────────────────────────────────
  patrol: ^3.14.1

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/audio/
    - assets/game/
    - assets/i18n/

  # Fonts are loaded via google_fonts package (SpaceGrotesk + Rajdhani)
