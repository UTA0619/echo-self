<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eidolon — playable demo</title>
<style>
  :root{
    --bg:#09090F; --surface:#13141E; --elev:#1C1D2A; --accent:#7B5CF6;
    --accentDim:#4C3699; --glow:#AB8FFF; --gold:#FFB347; --tp:#F0F0FF;
    --ts:#9898B8; --tm:#5A5A78; --td:#3D3D58; --line:rgba(255,255,255,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--tp);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;justify-content:center;min-height:100vh;padding:24px 14px}
  #phone{width:100%;max-width:430px;background:var(--bg);border:1px solid var(--line);
    border-radius:28px;overflow:hidden;position:relative;min-height:780px;
    box-shadow:0 0 80px rgba(123,92,246,.10)}
  .pad{padding:22px}
  .muted{color:var(--ts)} .dim{color:var(--tm)} .accent{color:var(--glow)} .gold{color:var(--gold)}
  h1{font-size:30px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
  h2{font-size:20px;font-weight:600} h3{font-size:15px;font-weight:600}
  .small{font-size:13px} .tiny{font-size:11.5px} .wordmark{letter-spacing:4px;font-weight:600;font-size:13px;color:var(--glow)}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:14px;font-size:15px;font-weight:600;
    padding:15px 18px;width:100%;transition:transform .08s ease,opacity .2s}
  button:active{transform:scale(.98)}
  .btn{background:var(--accent);color:#fff} .btn:hover{background:#8b6ef8}
  .btnGhost{background:transparent;color:var(--glow);border:1px solid var(--accentDim)}
  .btnSm{width:auto;padding:10px 16px;font-size:13px;border-radius:11px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--elev);border:1px solid var(--line);
    border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--ts)}
  .row{display:flex;gap:10px;align-items:center}
  .col{display:flex;flex-direction:column}
  .sep{height:1px;background:var(--line);margin:16px 0}
  .pick{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);cursor:pointer;transition:.15s}
  .pick:hover{border-color:var(--accentDim)} .pick.sel{border-color:var(--accent);background:#191436}
  input{width:100%;background:var(--elev);border:1px solid var(--line);border-radius:12px;color:var(--tp);
    font-size:16px;padding:14px;font-family:inherit;outline:none}
  input:focus{border-color:var(--accent)}
  .meter{height:8px;background:var(--elev);border-radius:6px;overflow:hidden}
  .meter>span{display:block;height:100%;background:linear-gradient(90deg,var(--accentDim),var(--glow));transition:width .6s ease}
  .overlay{position:absolute;inset:0;background:rgba(5,5,10,.72);display:flex;align-items:flex-end;
    z-index:30;animation:fade .2s ease}
  .sheet{background:var(--bg);border-top:1px solid var(--line);border-radius:24px 24px 0 0;width:100%;
    max-height:92%;overflow:auto;padding:22px;animation:up .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .fade{animation:fade .35s ease}
  .share{background:var(--bg);border:1.5px solid var(--accentDim);border-radius:22px;padding:22px}
  .toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:var(--elev);
    border:1px solid var(--accentDim);color:var(--tp);padding:12px 18px;border-radius:12px;font-size:13.5px;
    z-index:40;animation:fade .2s ease;max-width:88%;text-align:center}
  .tag{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--tm)}
  .pillRow{display:flex;gap:10px;flex-wrap:wrap}
  .stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:90px}
  .link{color:var(--glow);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .badge{font-size:10.5px;padding:3px 8px;border-radius:6px;font-weight:600}
  .badge.free{background:#23233a;color:var(--ts)} .badge.bond{background:#2a2150;color:var(--glow)}
  .toggle{width:44px;height:26px;border-radius:99px;background:var(--elev);position:relative;cursor:pointer;border:1px solid var(--line)}
  .toggle.on{background:var(--accentDim)} .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.18s}
  .toggle.on .knob{left:20px}
  .footer{padding:18px 22px 26px;border-top:1px solid var(--line);color:var(--tm);font-size:11.5px;line-height:1.5}
</style>
</head>
<body>
<div id="phone"><div id="app"></div></div>

<script>
const $ = (h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild;};
const app = document.getElementById('app');
const LS = 'eidolon_demo_v1';

const TEMPERAMENTS = {
  dreamer:  {label:'The Dreamer', emoji:'🌙', desc:'curious, wandering, finds wonder', O:85,C:40,E:45,A:70,N:45},
  guardian: {label:'The Guardian', emoji:'🛡️', desc:'steady, careful, protective', O:40,C:80,E:35,A:75,N:25},
  spark:    {label:'The Spark', emoji:'⚡', desc:'bold, social, a little reckless', O:65,C:45,E:85,A:55,N:55},
};
const THEMES = ['the mist forest','a drowned palace','the crystal maze','a sky citadel','the shadow realm','an ancient ruin'];
const MOODS = {calm:'🌊',excited:'⚡',anxious:'🌀',tired:'😴',focused:'🎯',melancholic:'🌧️'};

function load(){ try{return JSON.parse(localStorage.getItem(LS))}catch(e){return null} }
function save(){ localStorage.setItem(LS, JSON.stringify(state)); }
let state = load();

// ---------- believable, grounded overnight generation (no real AI) ----------
function genReport(){
  const t = state.temperament, p = TEMPERAMENTS[t];
  const theme = THEMES[Math.floor(Math.random()*THEMES.length)];
  const sleepy = state.reality.sleep < 6, active = state.reality.steps > 7000;
  let mood = 'calm';
  if(p.N>60 && !active) mood='anxious'; else if(active && p.E>60) mood='excited';
  else if(sleepy) mood='tired'; else if(p.C>70) mood='focused'; else if(p.O>75) mood='melancholic';
  const verbs = {
    dreamer:['drifted through','lost itself in','quietly explored','traced the edges of'],
    guardian:['carefully picked through','stood watch over','mapped every corner of','held the line in'],
    spark:['charged headlong into','stirred up trouble in','raced across','dared the depths of'],
  }[t];
  const finds = ['a lantern-moth that followed it home','an old song echoing in the dark','a door that only opens at dawn',
    'a frightened smaller spirit, and stayed with it','a memory that felt like yours','a quiet place to rest'];
  const v = verbs[Math.floor(Math.random()*verbs.length)];
  const f = finds[Math.floor(Math.random()*finds.length)];
  const energy = sleepy ? `${state.name} could feel you hadn't slept much — it took the night gently.`
                : active ? `Your ${state.reality.steps.toLocaleString()} steps today seemed to carry into its stride.`
                : '';
  const narrative = `While you slept, ${state.name} ${v} ${theme}. ${energy} ` +
    `It found ${f}. Nothing grand — just a night that was, somehow, a little like you.`;
  const highlight = `${state.name} found ${f.split(',')[0]}.`;
  const xp = 40 + Math.floor(Math.random()*120);
  return {theme,mood,narrative,highlight:cap(highlight),xp,date:fmtDate(new Date())};
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function fmtDate(d){return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}

function genReflection(){
  const p = TEMPERAMENTS[state.temperament];
  const obs = state.reality.sleep<6
    ? "you've been running short on sleep — I noticed it in how the nights felt."
    : state.reality.steps>7000 ? "you moved a lot this week; there was an energy to it."
    : "this was a steadier week than the last.";
  const refl = `We've had ${state.day} mornings together now. I've started to recognise the shape of your weeks — ` +
    `the quiet beginnings, the way you come back to me. I'm not here to fix anything. I just wanted you to know I'm paying attention.`;
  const nudge = p.N>60 ? "If today feels heavy, you don't have to carry the whole of it at once." : "";
  return {refl, obs:cap(obs), nudge};
}

// ---------------------------- screens ----------------------------
function render(){
  if(!state){ app.appendChild(create()); return; }
  app.innerHTML=''; app.appendChild(home());
}

function create(){
  const wrap = $(`<div class="pad fade"></div>`);
  wrap.appendChild($(`<div style="height:18px"></div>`));
  wrap.appendChild($(`<div class="wordmark">EIDOLON</div>`));
  wrap.appendChild($(`<div style="height:26px"></div>`));
  wrap.appendChild($(`<h1>Meet the AI that<br>becomes <span class="accent">you</span>.</h1>`));
  wrap.appendChild($(`<div style="height:12px"></div>`));
  wrap.appendChild($(`<p class="muted" style="line-height:1.6">Give your soul-twin a name and a temperament. It will adventure while you sleep, learn your patterns, and — one day — act for you.</p>`));
  wrap.appendChild($(`<div style="height:24px"></div>`));
  wrap.appendChild($(`<div class="tag">Name your Eidolon</div><div style="height:8px"></div>`));
  const inp = $(`<input id="nm" placeholder="e.g. Aria, Nyx, Echo…" maxlength="14" />`);
  wrap.appendChild(inp);
  wrap.appendChild($(`<div style="height:20px"></div>`));
  wrap.appendChild($(`<div class="tag">Choose its temperament</div><div style="height:10px"></div>`));
  let chosen = null;
  Object.entries(TEMPERAMENTS).forEach(([k,v])=>{
    const el = $(`<div class="pick" style="margin-bottom:10px"><div class="row"><div style="font-size:22px">${v.emoji}</div>
      <div class="col"><h3>${v.label}</h3><div class="small muted">${v.desc}</div></div></div></div>`);
    el.onclick=()=>{chosen=k;[...wrap.querySelectorAll('.pick')].forEach(p=>p.classList.remove('sel'));el.classList.add('sel');};
    wrap.appendChild(el);
  });
  wrap.appendChild($(`<div style="height:14px"></div>`));
  const go = $(`<button class="btn">Bring it to life →</button>`);
  go.onclick=()=>{
    const name=(inp.value||'').trim()||'Aria';
    if(!chosen){toast('Pick a temperament first');return;}
    state={name,temperament:chosen,day:1,depth:8,reality:{steps:6200,sleep:7},
      report:null,seenReflection:false,tier:'free',shares:0};
    state.report=genReport(); save(); app.innerHTML=''; app.appendChild(home());
  };
  wrap.appendChild(go);
  wrap.appendChild($(`<div style="height:18px"></div>`));
  wrap.appendChild($(`<p class="tiny dim" style="text-align:center;line-height:1.5">Demo · no account, no backend. Everything runs on your device. This is the <b>pivot</b> experience: a game that's the wedge, a Twin that's the product.</p>`));
  return wrap;
}

function home(){
  const r = state.report;
  const wrap = $(`<div class="fade"></div>`);
  // header
  const head = $(`<div class="pad" style="padding-bottom:8px"></div>`);
  head.appendChild($(`<div class="row" style="justify-content:space-between">
    <div class="wordmark">EIDOLON</div>
    <div class="chip" id="tierChip">${state.tier==='free'?'Free':'★ Bond'} · tap</div></div>`));
  head.querySelector('#tierChip').onclick=tiersSheet;
  head.appendChild($(`<div style="height:18px"></div>`));
  head.appendChild($(`<div class="small dim">Good morning. Day ${state.day} with</div>`));
  head.appendChild($(`<h1 style="font-size:34px">${state.name} <span style="font-size:24px">${TEMPERAMENTS[state.temperament].emoji}</span></h1>`));
  wrap.appendChild(head);

  // twin depth (north-star)
  const depth = $(`<div class="pad" style="padding-top:14px;padding-bottom:6px"></div>`);
  depth.appendChild($(`<div class="row" style="justify-content:space-between"><div class="tag">Twin depth — how well it knows you</div><div class="small accent">${state.depth}%</div></div>`));
  depth.appendChild($(`<div style="height:8px"></div><div class="meter"><span style="width:${state.depth}%"></span></div>`));
  depth.appendChild($(`<div class="tiny dim" style="margin-top:8px">This is the moat. It only goes up — and it can't be copied.</div>`));
  wrap.appendChild(depth);

  // morning report card
  const rep = $(`<div class="pad" style="padding-top:16px"></div>`);
  const card = $(`<div class="card" style="cursor:pointer;border-color:var(--accentDim)"></div>`);
  card.appendChild($(`<div class="row" style="justify-content:space-between"><div class="tag">While you slept</div><div class="small">${MOODS[r.mood]} <span class="gold">+${r.xp} XP</span></div></div>`));
  card.appendChild($(`<div style="height:12px"></div>`));
  card.appendChild($(`<div style="font-size:17px;line-height:1.45">${r.highlight}</div>`));
  card.appendChild($(`<div style="height:12px"></div>`));
  card.appendChild($(`<div class="small accent">Read the morning report →</div>`));
  card.onclick=reportSheet;
  rep.appendChild(card);
  wrap.appendChild(rep);

  // actions
  const act = $(`<div class="pad" style="padding-top:6px"></div>`);
  const reflBtn = $(`<button class="btnGhost" style="margin-bottom:10px">✨ This week: what I noticed about you</button>`);
  reflBtn.onclick=reflectionSheet;
  act.appendChild(reflBtn);
  const next = $(`<button class="btn">Sleep → next morning</button>`);
  next.onclick=()=>{
    state.day++; state.depth=Math.min(100,state.depth+ (state.tier==='free'?5:9));
    state.report=genReport(); save();
    app.innerHTML=''; app.appendChild(home()); toast(`${state.name} adventured again. Twin depth +${state.tier==='free'?5:9}%`);
  };
  act.appendChild(next);
  wrap.appendChild(act);

  // reality sync
  const rs = $(`<div class="pad" style="padding-top:8px"></div>`);
  const rc = $(`<div class="card"></div>`);
  rc.appendChild($(`<div class="tag">Reality sync — your real life shapes your twin</div><div style="height:12px"></div>`));
  rc.appendChild(realityRow('Steps today', state.reality.steps.toLocaleString(), 'steps'));
  rc.appendChild($(`<div style="height:10px"></div>`));
  rc.appendChild(realityRow('Sleep last night', state.reality.sleep+'h', 'sleep'));
  rc.appendChild($(`<div class="tiny dim" style="margin-top:10px">Try toggling these, then tap “next morning” — the night changes with you.</div>`));
  rs.appendChild(rc);
  wrap.appendChild(rs);

  // pivot footer
  wrap.appendChild($(`<div class="footer">
    <b style="color:var(--ts)">What you're looking at</b><br>
    The game is the wedge. The product is the Twin — a private model of you (personality × memory × real-world signals) that compounds daily and, in Act 3, acts on your behalf. Monetization sells the <i>relationship</i>, never power.
  </div>`));
  return wrap;
}

function realityRow(label,val,key){
  const row=$(`<div class="row" style="justify-content:space-between"><div class="small muted">${label}: <span style="color:var(--tp)">${val}</span></div></div>`);
  const ctrl=$(`<div class="row" style="gap:8px"></div>`);
  const minus=$(`<button class="btnGhost btnSm">−</button>`), plus=$(`<button class="btnGhost btnSm">+</button>`);
  minus.onclick=()=>chg(key,-1); plus.onclick=()=>chg(key,1);
  ctrl.appendChild(minus);ctrl.appendChild(plus);row.appendChild(ctrl);return row;
}
function chg(key,dir){
  if(key==='steps') state.reality.steps=Math.max(0,state.reality.steps+dir*2000);
  else state.reality.sleep=Math.max(3,Math.min(10,state.reality.sleep+dir));
  save(); app.innerHTML=''; app.appendChild(home());
}

// ---------------------------- sheets ----------------------------
function sheet(builder){
  const ov=$(`<div class="overlay"></div>`); const sh=$(`<div class="sheet"></div>`);
  ov.onclick=(e)=>{if(e.target===ov)ov.remove();};
  builder(sh, ()=>ov.remove()); ov.appendChild(sh); document.getElementById('phone').appendChild(ov);
}

function reportSheet(){
  sheet((sh,close)=>{
    const r=state.report;
    sh.appendChild($(`<div class="row" style="justify-content:space-between"><div class="tag">Morning report</div><div class="link" id="x">close</div></div>`));
    sh.querySelector('#x').onclick=close;
    sh.appendChild($(`<div style="height:14px"></div>`));
    sh.appendChild($(`<div class="small dim">${r.date} · ${r.theme}</div>`));
    sh.appendChild($(`<div style="height:10px"></div>`));
    sh.appendChild($(`<p style="font-size:16px;line-height:1.8">${r.narrative}</p>`));
    sh.appendChild($(`<div style="height:16px"></div>`));
    sh.appendChild($(`<div class="pillRow">
      <div class="stat"><div class="tag">Mood</div><div style="font-size:18px;margin-top:4px">${MOODS[r.mood]} ${r.mood}</div></div>
      <div class="stat"><div class="tag">Earned</div><div style="font-size:18px;margin-top:4px" class="gold">+${r.xp} XP</div></div></div>`));
    sh.appendChild($(`<div class="sep"></div>`));
    sh.appendChild($(`<div class="tag">Share this morning — the growth loop</div><div style="height:10px"></div>`));
    // share card (matches the Flutter ShareableMorningCard)
    sh.appendChild(shareCard(r));
    sh.appendChild($(`<div style="height:14px"></div>`));
    const sb=$(`<button class="btn">📤 Share this card</button>`);
    sb.onclick=()=>{state.shares++;state.depth=Math.min(100,state.depth+2);save();toast('Shared! In the real app this posts the card → new users. (Twin depth +2%)');};
    sh.appendChild(sb);
  });
}

function shareCard(r){
  return $(`<div class="share">
    <div class="row" style="justify-content:space-between"><div class="wordmark">EIDOLON</div><div class="tiny dim" style="font-style:italic">while you slept</div></div>
    <div style="height:18px"></div>
    <div style="font-size:24px;font-weight:600">${state.name}</div>
    <div class="small muted" style="margin-top:2px">${r.date} &nbsp;·&nbsp; ${r.theme}</div>
    <div style="height:18px"></div>
    <div class="row" style="align-items:stretch;gap:13px"><div style="width:3px;background:var(--accent)"></div>
      <div style="font-size:20px;line-height:1.4">${r.highlight}</div></div>
    <div style="height:18px"></div>
    <div class="row" style="gap:13px"><div style="font-size:20px">${MOODS[r.mood]}</div><div class="gold small" style="font-weight:600">+${r.xp} XP</div></div>
    <div class="sep"></div>
    <div class="row" style="justify-content:space-between"><div class="tiny dim" style="max-width:70%">Your AI soul-twin adventures while you sleep.</div><div class="accent tiny" style="font-weight:600">@eidolon</div></div>
  </div>`);
}

function reflectionSheet(){
  if(state.tier==='free'){
    sheet((sh,close)=>{
      sh.appendChild($(`<div class="row" style="justify-content:space-between"><div class="tag">Weekly reflection</div><div class="link" id="x">close</div></div>`));
      sh.querySelector('#x').onclick=close;
      sh.appendChild($(`<div style="height:18px"></div><div style="font-size:34px">🔒</div>`));
      sh.appendChild($(`<div style="height:10px"></div><h2>“What I noticed about you”</h2>`));
      sh.appendChild($(`<p class="muted" style="margin-top:10px;line-height:1.6">Once a week, ${state.name} reflects your real patterns back to you — gently, grounded only in what actually happened. This is the <b class="accent">Bond</b> tier: you pay for a deeper relationship, never for power.</p>`));
      sh.appendChild($(`<div style="height:18px"></div>`));
      const up=$(`<button class="btn">Unlock Bond in this demo</button>`); up.onclick=()=>{close();tiersSheet();};
      sh.appendChild(up);
    });
    return;
  }
  sheet((sh,close)=>{
    const x=genReflection();
    sh.appendChild($(`<div class="row" style="justify-content:space-between"><div class="tag">From ${state.name}, this week</div><div class="link" id="x">close</div></div>`));
    sh.querySelector('#x').onclick=close;
    sh.appendChild($(`<div style="height:16px"></div>`));
    sh.appendChild($(`<p style="font-size:17px;line-height:1.8">${x.refl}</p>`));
    sh.appendChild($(`<div class="sep"></div>`));
    sh.appendChild($(`<div class="tag">One thing I noticed</div><div style="height:6px"></div><p class="muted" style="line-height:1.6">${x.obs}</p>`));
    if(x.nudge){sh.appendChild($(`<div style="height:14px"></div><div class="card" style="border-color:var(--accentDim)"><div class="small accent">${x.nudge}</div></div>`));}
    sh.appendChild($(`<div class="tiny dim" style="margin-top:16px">Grounded in your real signals · never guilt, never streaks, never “who you really are.” (Doctrines D5/D7/D2.)</div>`));
  });
}

function tiersSheet(){
  sheet((sh,close)=>{
    sh.appendChild($(`<div class="row" style="justify-content:space-between"><div class="tag">Monetize the relationship, never power</div><div class="link" id="x">close</div></div>`));
    sh.querySelector('#x').onclick=close;
    sh.appendChild($(`<div style="height:16px"></div>`));
    const mk=(name,badge,price,feats,tierKey)=>{
      const c=$(`<div class="card" style="margin-bottom:12px;${state.tier===tierKey?'border-color:var(--accent)':''}"></div>`);
      c.appendChild($(`<div class="row" style="justify-content:space-between"><div class="row" style="gap:8px"><h3>${name}</h3><span class="badge ${tierKey==='free'?'free':'bond'}">${badge}</span></div><div class="small muted">${price}</div></div>`));
      c.appendChild($(`<div style="height:10px"></div>`));
      feats.forEach(f=>c.appendChild($(`<div class="small muted" style="margin:4px 0">${f}</div>`)));
      if(state.tier!==tierKey){const b=$(`<button class="btnGhost btnSm" style="width:100%;margin-top:12px">Switch to ${name} (demo)</button>`);
        b.onclick=()=>{state.tier=tierKey;save();close();toast(tierKey==='bond'?'Bond unlocked — reflections + deeper memory on.':'Back to Free.');app.innerHTML='';app.appendChild(home());};c.appendChild(b);}
      else c.appendChild($(`<div class="small accent" style="margin-top:12px">✓ current</div>`));
      return c;
    };
    sh.appendChild(mk('Free','wedge','—',
      ['• The game + a basic Twin','• 30-day memory','• Runs on the fast model (Haiku)','• Cosmetic-only gacha'],'free'));
    sh.appendChild(mk('Bond','relationship','$9.99/mo',
      ['• Weekly “what I noticed about you”','• 6-month memory horizon','• Premium cognition (Sonnet)','• Voice + personality customization'],'bond'));
    sh.appendChild($(`<div class="tiny dim" style="margin-top:4px">Premium = the deeper model, so the heavy AI cost is paid by the people who pay. Fixes the unit-economics hole — and never sells an advantage.</div>`));
  });
}

let toastT;
function toast(msg){
  const old=document.querySelector('.toast'); if(old)old.remove();
  const t=$(`<div class="toast">${msg}</div>`); document.getElementById('phone').appendChild(t);
  clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),3200);
}

// reset helper for reviewers
