# fly.toml — ECHO API Gateway deployment config for Fly.io
# Deploy: fly deploy --config services/api-gateway/fly.toml

app    = "echo-api-gateway"
primary_region = "nrt"  # Tokyo — closest to primary users

[build]
  dockerfile = "Dockerfile"

[env]
  PORT        = "8080"
  ENV         = "production"
  # Set secrets via: fly secrets set SUPABASE_URL=... SUPABASE_JWT_SECRET=...

[http_service]
  internal_port = 8080
  force_https   = true
  auto_stop_machines  = true
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 1000
    soft_limit = 800

[[vm]]
  cpu_kind = "shared"
  cpus     = 1
  memory_mb = 256
